name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check app scripts

  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python scripts/make_fixtures.py
      - run: pytest tests/unit tests/integration -q
      - run: python scripts/pii_scan.py

  frontend-lint-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b --noEmit

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          retention-days: 3

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python scripts/make_fixtures.py
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend deps (dist already built as artifact is not needed; e2e serves SPA from TAB_STATIC_DIR)
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        working-directory: web
        run: pnpm build
      - name: Run E2E journey
        run: bash scripts/run_e2e_server.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/test-results/
          retention-days: 3

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tabledger:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy scan (app-level HIGH/CRIT must be clean)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tabledger:ci
          severity: HIGH,CRITICAL
          ignorefile: .trivyignore
          skip-dirs: /usr/local/lib/python3.12/site-packages/pip/_vendor
          exit-code: "1"
      - name: Clean-start smoke test
        run: |
          docker run -d --name smoke -p 127.0.0.1:18765:8000 \
            -e TAB_BOOTSTRAP_PASSWORD=ci-smoke-pass-01 \
            -e TAB_ALLOWED_HOSTS='*' tabledger:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18765/api/v1/health >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:18765/api/v1/health
          curl -sf http://127.0.0.1:18765/ | grep -q '<div id="root">'
          docker rm -f smoke
